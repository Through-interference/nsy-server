[metadata]
name = nsy-server
version = 0.1.0
description = Ground-station receiver for BVS camera video
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10

[options.packages.find]
where = src

[options.data_files]
share/nsy-server/config = config/station.json
